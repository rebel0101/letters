<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Letters To My Gulabo ❤️</title>

<meta name="theme-color" content="#05070d">

<!--=========================
GOOGLE FONTS
==========================-->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!--=========================
ICONS
==========================-->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<!--=========================
MAIN CSS
==========================-->

<link rel="stylesheet"
href="style.css">

<link rel="icon" type="image/png" href="favicon.png">

</head>

<body>

<!--==========================================
BACKGROUND
===========================================-->

<div id="background">

<div class="stars"></div>

<div class="twinkling"></div>

<div class="aurora"></div>

</div>

<!--==========================================
PASSWORD PAGE
===========================================-->

<section id="lockScreen">

<div class="glass-box">

<div class="moon">

🌙

</div>

<h1>

Letters To My

<span>

Gulabo

</span>

</h1>

<p>

This little world...

is made only for one person.

❤️

</p>

<input

type="password"

id="password"

placeholder="Enter Password">

<button id="unlockBtn">

Unlock ❤️

</button>

<p id="wrongPassword">

Wrong Password

</p>

</div>

</section>

<!--==========================================
NETFLIX INTRO
===========================================-->

<section id="intro">

<div class="intro-text">

Letters To My Gulabo

</div>

</section>

<!--==========================================
LOADER
===========================================-->

<div id="loader">

<div class="loader-heart">

❤️

</div>

<p>

Loading Beautiful Memories...

</p>

</div>

<!--==========================================
SCRIPTS
===========================================-->

<!--==========================================
PHASE 2A
MOON WORLD
===========================================-->

<section id="moonWorld">

    <!-- Sky Layer -->

    <div id="moonSky"></div>

    <!-- Clouds -->

    <div id="cloudLayer">

        <div class="cloud cloud1"></div>

        <div class="cloud cloud2"></div>

        <div class="cloud cloud3"></div>

    </div>

    <!-- Fireflies -->

    <div id="fireflies"></div>

    <!-- Shooting Stars -->

    <div id="shootingStars"></div>

    <!-- Petals -->

    <div id="petals"></div>

    <!-- Roses -->

    <div id="roses"></div>

    <!-- Moon -->

    <div class="moon-wrapper">

        <div class="realMoon">

            <div class="moonGlow"></div>

            <div class="crater crater1"></div>

            <div class="crater crater2"></div>

            <div class="crater crater3"></div>

            <div class="crater crater4"></div>

        </div>

    </div>

    <!-- Content -->

    <div class="moonContent">

        <h1>

            Welcome To My Little World ❤️

        </h1>

        <p>

            The Moon has been waiting for you...

        </p>

        <button id="touchMoon">

            🌙 Touch The Moon

        </button>

    </div>

</section>

<!--==========================================
PHASE 3
3D ENVELOPE
===========================================-->

<section id="envelopeScene">

    <div class="envelope-wrapper">

        <div class="envelope">

            <!-- Back -->

            <div class="envelope-back"></div>

            <!-- Letter -->

            <div class="letter-paper">

               <div class="letter-content">

   <h2>Dear Gulabo ❤️</h2>

<div class="letter-body">

    <p id="typeLetter"></p>

</div>

<button id="continueBtn">
    Continue ❤️
</button>

</div>

            </div>

            <!-- Left -->

            <div class="fold fold-left"></div>

            <!-- Right -->

            <div class="fold fold-right"></div>

            <!-- Bottom -->

            <div class="fold fold-bottom"></div>

            <!-- Top -->

            <div class="top-flap"></div>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="script.js"></script>

<div id="pageFade"></div>

</body>

</html>
