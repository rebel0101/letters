<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Letter 1 ❤️</title>

    <link rel="stylesheet" href="letter.css">

    <link rel="icon" type="image/png" href="favicon.png">

</head>

<body class="letter-page">

    <div id="pageTransition"></div>

    <div class="ambient-glow"></div>

    <div id="roseContainer"></div>

<div class="candle-light"></div>

<div class="particles"></div>

<div class="particles particles2"></div>

<div class="letter-wrapper">

    <div class="paper reveal">

        <div class="paper-header">

            <h1>Dear Gulabo ❤️</h1>

        </div>

        <div class="paper-body">

            <p id="letterText"></p>

            <div class="gold-divider"></div>

            <div class="shayari-box">

    <h3>🌹 Shayari</h3>

    <p id="shayariText"></p>

</div>

<div class="love-quote">

    “Every love story is beautiful,
    but ours will always be my favourite.”

</div>

<div class="memory-card reveal">

    <div class="memory-title">

        💖 Our First Memory

    </div>

    <div class="memory-date">

        19 October 2023

    </div>

    <p>

        The day our journey started...
        I never knew someone could become
        my home, my peace and my forever.

    </p>

</div>

            <div class="signature-heart">❤️</div>

            <div class="signature">

Forever Yours,

<span>Akki ❤️</span>

</div>

            <button id="nextLetterBtn">
    Next Letter ❤️
</button>

        </div>

    </div>

</div>

<div id="floatingHearts"></div>

<audio id="bgMusic" loop>
    <source src="music/bg.mp3" type="audio/mpeg">
</audio>

<audio id="paperSound" preload="auto">
    <source src="sounds/paper-open.mp3" type="audio/mpeg">
</audio>

<audio id="clickSound" preload="auto">
    <source src="sounds/click copy.mp3" type="audio/mpeg">
</audio>

<div id="musicBtn" class="music-player">

    <span class="music-ring"></span>

    <span class="wave wave1"></span>

    <span class="wave wave2"></span>

    <span class="wave wave3"></span>

    <div class="music-disc">
        🎵
    </div>

</div>

<script src="letter.js"></script>
<script src="music/music.js"></script>

</body>

</html>
